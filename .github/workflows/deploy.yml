name: Local Docker Auto-Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5 # Pull history so we can extract commit logs

      - name: Build local Docker image
        run: |
          docker build -t plexscraper-verifier:latest .

      - name: Stop and recreate container
        run: |
          # If the container exists, stop and remove it
          if [ "$(docker ps -aq -f name=plex-verifier)" ]; then
            echo "Stopping old container..."
            docker stop plex-verifier
            docker rm plex-verifier
          fi
          
          echo "Starting updated container..."
          # Start the new container using the correct Ollama model name alias
          docker run -d \
            --name plex-verifier \
            --restart unless-stopped \
            -p 8000:8000 \
            -e DATABASE_URL="sqlite:////app/data/plex_verification.db" \
            -e OLLAMA_API_URL="http://10.0.0.242:11434" \
            -e OLLAMA_MODEL="qwen2.5vl" \
            -e SCAN_PATHS="/media" \
            -v "/opt/plexscraper/data:/app/data" \
            -v "/opt/plexscraper/processed_media:/app/processed_media" \
            -v "/mnt/unraid/movies:/media/Movies" \
            -v "/mnt/unraid/tv:/media/TV" \
            plexscraper-verifier:latest

      - name: Send Discord Deployment Notification
        run: |
          AUTHOR=$(git log -1 --pretty=%an)
          
          # 1. Get list of files modified in the latest commit (limit to 10 lines)
          MODIFIED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD | head -n 10 | sed 's/^/• /' | tr '\n' '\\' | sed 's/\\/\\n/g')
          if [ -z "$MODIFIED_FILES" ]; then
            MODIFIED_FILES="No file modifications detected."
          fi
          
          # 2. Get last 3 commits in this push (oneline log)
          RECENT_COMMITS=$(git log -n 3 --oneline | sed 's/^/• /' | tr '\n' '\\' | sed 's/\\/\\n/g')
          
          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "🚀 PlexScraper Auto-Deployed Successfully!",
              "color": 3066993,
              "fields": [
                {
                  "name": "Branch",
                  "value": "`${{ github.ref_name }}`",
                  "inline": true
                },
                {
                  "name": "Deploy Author",
                  "value": "$AUTHOR",
                  "inline": true
                },
                {
                  "name": "Recent Commits",
                  "value": "$RECENT_COMMITS",
                  "inline": false
                },
                {
                  "name": "Modified Files (Latest)",
                  "value": "$MODIFIED_FILES",
                  "inline": false
                },
                {
                  "name": "Status",
                  "value": "✅ Running locally on Portainer (`plex-verifier`)",
                  "inline": false
                }
              ],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )
          
          curl -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               https://discord.com/api/webhooks/1532893949059010591/E_Q_S8DXEygMLgRFsJpqbrrwz5vNXth0p6pQNHylEU21nO0Z3GoI9qsBRblDGx1QXGek
